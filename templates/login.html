<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
  </head>
  <body>
    <form action="/login" method="POST">
    <h2>Login form</h2>
      <p>
        <label for="email">Email:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tenant@building.com"
          required
        />
      </p>

      <p>
        <label for="password">Password:</label><br />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </p>

      <p>
        <button type="submit">Log In</button>
      </p>
    </form>
  </body>
</html>
